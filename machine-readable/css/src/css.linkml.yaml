id: https://standards.example/css
name: css
title: CSS coordination scaling record
description: >-
  The one canonical source for the machine-readable layer of the Coordination Scaling Standard
  (standards-3_0-coordination-scaling, v0.1.5), the seventh compressive standard and the
  precondition-compressive substrate of the suite. CSS assesses a coordination unit by scale
  across six nested Dunbar-scale Radii, each individuated by the coordination function that
  breaks at its threshold, so the model renders the Radii as typed CoordinationRadius objects
  carrying their threshold justification, attack surface, and minimum, maximum, and interface
  conditions, not a bare enum of radius numbers. Rendering that structural content as a flat
  list of numbers would collapse the threshold structure into labels, a precision deficit under
  the Precision-First Design Standard whose absent structure leaves no gap marker.

  Two modeling choices make the record faithful to the standard and usable across scale
  substrates without importing thresholds the standard has not measured. The effective Radius is
  determined by which coordination functions have broken (the functional-break assessment, which
  Section 11 names the primary instrument in all contexts) with the numeric Radius derived from
  that, so a unit on any substrate assesses itself against the same functional breaks. And the
  effective-Radius aggregate is an open named-factor set (Section 2 defines it as "at minimum"
  member count, interaction quality, shared context depth, and medium mix), so a consumer on a
  different substrate supplies its own factors into the same structure.

  The tree root is a CoordinationScalingRecord. Whether a given minimum condition is installed or
  a maximum condition closed is judgment routed to the checker; several conditions carry
  computable detection signals that indicate where to look. Radius 500, Radius 1500, and the
  affected-party reach axis are provisional in the standard and are marked provisional here.
  Every artifact in dist/ is generated from this file.
license: CC-BY-4.0
prefixes:
  linkml: https://w3id.org/linkml/
  css: https://standards.example/css/
default_prefix: css
default_range: string
imports:
  - linkml:types

classes:

  CoordinationScalingRecord:
    tree_root: true
    description: A coordination unit's assessment against the scaling standard, from its effective-Radius determination through per-Radius conformance to its adoption level.
    attributes:
      subject:
        description: The coordination unit under assessment (a project, organization, protocol, working group, or agent unit).
        required: true
      effective_radius:
        description: Section 11. The unit's effective-Radius assessment, determined by which coordination functions have broken.
        range: EffectiveRadiusAssessment
        required: true
      crossed_thresholds:
        description: >-
          Sections 4 to 9. One entry per crossed Radius, carrying the Radius and the status of its
          minimum, maximum, and interface conditions. A crossed Radius is present here iff its
          function break is recorded in the effective-Radius assessment; a record that names a
          crossed threshold without enumerating its conditions is rejected.
        range: RadiusConformance
        multivalued: true
        inlined_as_list: true
        required: true
      reach:
        description: Section 10 (provisional). The affected-party reach-axis assessment, if the unit has made one.
        range: AffectedPartyReach
      adoption_level:
        description: Section 12. The adoption level the record supports.
        range: AdoptionLevel
        required: true
      conformance:
        description: The scaling conformance answers on the face; no total.
        range: ConformanceDeclaration
        required: true

  EffectiveRadiusAssessment:
    description: >-
      Section 11. The determination of the unit's effective Radius by the functional breaks, the
      primary instrument in all contexts, with the numeric Radius derived from them. Carries the
      aggregate factors as an open set and the nominal-versus-robust distinction.
    attributes:
      function_breaks:
        description: >-
          Section 11. One entry per assessed coordination function, recording whether it has
          broken. The set of broken functions determines which thresholds are crossed; this is
          the operative instrument, not the numeric threshold.
        range: FunctionBreak
        multivalued: true
        inlined_as_list: true
        required: true
      aggregate_factors:
        description: >-
          Section 2. The factors the effective Radius aggregates, as an open named set (at minimum
          member count, interaction frequency and quality, shared context depth, and communication
          medium mix); a consumer on a different scale substrate supplies its own factors here.
        range: AggregateFactor
        multivalued: true
        inlined_as_list: true
        required: true
      nominal_effective_radius:
        description: Section 2. The effective Radius with full membership present, derived from the function breaks.
        range: RadiusValue
        required: true
      robust_effective_radius:
        description: >-
          Section 2. The highest Radius whose minimum conditions would still hold under worst-case
          single departure of the highest-coordination-weight individual. A gap below the nominal
          is a fragility finding.
        range: RadiusValue
        required: true
      contextual_baseline:
        description: >-
          Section 11 (Precision-First Design Standard Corollary 9). A statement of the unit's
          structural context where it diverges from the research-derived anchor contexts, since the
          threshold numbers are approximations and the functional questions are primary.

  FunctionBreak:
    description: >-
      Section 11. One coordination function and whether it has broken at the unit's scale. The
      function names the observable break; its status carries the assessment. A break with no
      status is not an assessment, so function and broken are required.
    attributes:
      function:
        description: >-
          The coordination function assessed (for example state_legibility at Radius 5,
          sympathy_network at Radius 15, capacity_inventory at Radius 50, reputation_norm_response
          at Radius 150, single_narrative at Radius 500).
        required: true
      radius:
        description: The Radius whose crossing this function's break indicates.
        range: RadiusValue
        required: true
      broken:
        description: Whether the function has broken (the threshold is crossed) or still holds.
        range: boolean
        required: true
      approach_noted:
        description: >-
          Section 11. Whether the function is stressed or unreliable while not yet broken, which is
          threshold approach, not a conformance finding, but a trigger for the next founding window.
        range: boolean

  AggregateFactor:
    description: Section 2. One named factor contributing to the effective-Radius aggregate, with its assessed value.
    attributes:
      name:
        description: The factor name (member_count, interaction_quality, shared_context_depth, medium_mix, or a substrate-specific factor).
        required: true
      value:
        description: The assessed value or level of the factor, as the assessor records it.
        required: true

  RadiusConformance:
    description: >-
      Sections 4 to 9. The conformance status of one crossed Radius: the Radius rendered as its
      typed threshold structure, with its minimum conditions enumerated by status and its maximum
      conditions checked. A crossed Radius carries its conditions or it is not a conformance claim,
      so radius, minimum_conditions, and maximum_conditions are required.
    attributes:
      radius:
        description: The crossed Radius, as its typed threshold structure.
        range: CoordinationRadius
        required: true
      minimum_conditions:
        description: >-
          The Radius's minimum conditions, each with its installed status. These are the floor at
          this threshold, the compressive bound on generative scaling: a hard lower bound that must
          be present, so a single absent minimum condition is a conformance breach that does not
          aggregate away against conditions met elsewhere (the floor-aware, non-averaging
          discipline). This is also the structural weld: a crossed Radius cannot claim conformance
          while silent on its minimum conditions.
        range: ConditionStatus
        multivalued: true
        inlined_as_list: true
        required: true
      maximum_conditions:
        description: The Radius's maximum conditions, each with whether it is absent (the capture vector closed) or present (a conformance failure).
        range: ConditionStatus
        multivalued: true
        inlined_as_list: true
        required: true
      interface_conditions_documented:
        description: Section (Radius).5. Whether the Radius's interface conditions are documented and externally legible.
        range: boolean

  CoordinationRadius:
    description: >-
      One Dunbar-scale threshold rendered as a typed structure. Individuated by the coordination
      function that breaks at it and the attack surface that opens, not by its number alone. The
      number, the function break, and the attack surface are required; a Radius reduced to its
      number has dropped the structure that individuates it.
    attributes:
      radius:
        description: The Radius value.
        range: RadiusValue
        required: true
      function_break:
        description: The coordination function that breaks at this threshold.
        required: true
      attack_surface:
        description: The exploitation vector that opens when this threshold is crossed without its minimum conditions.
        required: true
      provisional:
        description: Whether this Radius is provisional in the standard (true for Radius 500 and Radius 1500).
        range: boolean

  ConditionStatus:
    description: One minimum or maximum condition and its status, so a condition is never asserted without an installed-or-absent determination.
    attributes:
      condition:
        description: The condition, stated operationally.
        required: true
      status:
        description: The condition's status against the unit.
        range: ConditionState
        required: true
      detection_signal:
        description: >-
          A computable signal that indicates where to look for the condition's presence or absence;
          it locates the check, it does not by itself prove installation.

  AffectedPartyReach:
    description: >-
      Section 10 (provisional). The affected-party reach-axis assessment, orthogonal to the Radii.
      Whether the unit is above its reach ceiling, and if so whether the proxy or guardian channel
      is present.
    attributes:
      above_reach_ceiling:
        description: >-
          Section 10.2. Whether the affected population exceeds what the unit can identify and reach
          through channels it maintains, so its knowledge is impressionistic (the ceiling crossed).
        range: boolean
        required: true
      proxy_or_guardian_channel:
        description: >-
          Section 10.4. Above the ceiling, whether a structurally authorized proxy or guardian
          channel is operative (not disclosure-only). A minimum condition when above the ceiling.
        range: boolean
      constituency_not_unilaterally_controlled:
        description: Section 10.5. Whether the affected-party constituency is one the unit does not unilaterally define to its convenience.
        range: boolean

  ConformanceDeclaration:
    description: >-
      The scaling conformance answers on the face. There is deliberately no overall or total field:
      conformance is per-condition across crossed thresholds, mirroring the suite's refusal to
      collapse a profile into a single number.
    attributes:
      effective_radius_assessed:
        range: ConformanceAnswer
        required: true
      minimum_conditions_present:
        range: ConformanceAnswer
        required: true
      maximum_conditions_absent:
        range: ConformanceAnswer
        required: true
      sequential_build_respected:
        range: ConformanceAnswer
        required: true

enums:

  RadiusValue:
    description: Section 2. The six defined Radii, by approximate relational threshold.
    permissible_values:
      radius_5:
      radius_15:
      radius_50:
      radius_150:
      radius_500:
      radius_1500:

  ConditionState:
    description: The status of a minimum or maximum condition; silence is not one of the values.
    permissible_values:
      present:
      absent:
      not_applicable:

  AdoptionLevel:
    description: Section 12. The five adoption levels.
    permissible_values:
      assessed:
      operational:
      instrumented:
      loop_closed:
      auditable:

  ConformanceAnswer:
    description: Per-condition answer; silence is not one of the values.
    permissible_values:
      satisfied:
      declared_absent_with_justification:
      not_applicable:
