id: https://standards.example/iacs
name: iacs
title: IACS information asymmetry classification
description: >-
  The one canonical source for the machine-readable layer of the Information Asymmetry
  Classification Standard (standards-3_0-information-asymmetry, v0.1.28). IACS classifies by
  mechanism, not by a label list, so the model renders the classes as typed AsymmetryMechanism
  objects, each carrying its causal process, its detection surface, its orthogonality, its
  status, its Cynefin domain, and its structural remediation direction. Rendering these
  distinct structural mechanisms as a flat taxonomy of class names would collapse the
  mechanism structure into labels, a precision deficit under PFDS whose absent structure
  leaves no gap marker; the structural rendering is deliberate for that reason.

  The tree root is an IACSConformanceRecord, a system's declaration of which mechanisms it
  instruments (the code system, rendered as structured objects), the classifications it has
  produced against them, its detection architecture and tier, and its per-obligation
  conformance. Every artifact in dist/ is generated from this file.

  The interpretive obligations are not schema-expressible and belong to the conformance
  checker: whether a coordination record actually exhibits a mechanism (the detection surfaces
  are computable signals that indicate where to look, not proof), whether a class is orthogonal
  and validly individuated, and whether taxonomy stewardship resists capture. Tier-gating stays
  in the checker. IACS is diagnostic: each mechanism carries a remediation direction as a
  pointer, and the remediation architecture is deferred to companion specs.
license: CC-BY-4.0
prefixes:
  linkml: https://w3id.org/linkml/
  iacs: https://standards.example/iacs/
default_prefix: iacs
default_range: string
imports:
  - linkml:types

classes:

  IACSConformanceRecord:
    tree_root: true
    description: A system's declaration of the mechanisms it instruments, its classifications, its detection architecture, and its conformance.
    attributes:
      applicable_mechanisms:
        description: >-
          Section 6. The mechanisms the system identifies as applicable, rendered as structured
          objects (the code system, not a label list). Each carries its causal process, detection
          surface, orthogonality, status, Cynefin domain, and remediation direction.
        range: AsymmetryMechanism
        multivalued: true
        inlined_as_list: true
        required: true
      classifications:
        description: Section 6. The classifications the system has produced, each referencing a mechanism and the signals observed.
        range: Classification
        multivalued: true
        inlined_as_list: true
      architecture:
        description: The system's detection architecture and adopted tier.
        range: IACSArchitecture
        required: true
      conformance:
        description: Per-obligation conformance answers on the face; no total.
        range: ConformanceDeclaration
        required: true

  AsymmetryMechanism:
    description: >-
      Section 2, 3, 5. One distinct information-asymmetry mechanism, individuated by its causal
      process and its detection surface, not by a label. A mechanism with no detection surface
      cannot be instrumented (Section 2 validity criterion 3), so detection_surface is required.
    attributes:
      id:
        description: The mechanism handle (for example, positional, interpretive, synthetic_coordination).
        required: true
      name:
        required: true
      mechanism:
        description: Section 2 criterion 1. The distinct causal process by which advantage accumulates through informational position.
        required: true
      detection_surface:
        description: Section 2 criterion 3. The observable signals in the coordination record that indicate the mechanism is active.
        multivalued: true
        required: true
      orthogonal_at_mechanism:
        description: Section 2 criterion 4. True when the mechanism is individuated at the level of causal process, so its presence does not entail another's.
        range: boolean
        required: true
      status:
        description: Section 5. Whether the mechanism is primary, a fully specified extension, or a scoped-out stub (not usable in a conforming detection architecture).
        range: MechanismStatus
        required: true
      cynefin_domain:
        description: Section 4.1. The Cynefin domain that sets the detection action mode.
        range: CynefinDomain
      remediation_direction:
        description: Section 5 Scope. The structural remediation direction the mechanism implies; a pointer, since IACS defers the remediation architecture.
      sub_pattern:
        description: A named sub-pattern of this mechanism (for example, Distributed Monoculture, Coordination Record Asymmetry, Consensus Manufacturing).
        multivalued: true

  Classification:
    description: Section 6. One classification of a coordination record against a mechanism.
    attributes:
      mechanism:
        description: The handle of the mechanism assigned (references an applicable_mechanisms entry).
        required: true
      detection_signals_observed:
        description: The specific detection-surface signals observed in the record.
        multivalued: true
        required: true
      cynefin_domain:
        description: Section 4.1. The Cynefin domain classification applied, with its action mode.
        range: CynefinDomain
        required: true

  IACSArchitecture:
    description: The system-level detection architecture and tier. Higher-tier fields are optional in the schema; the checker requires them at the tiers the register specifies.
    attributes:
      adopted_tier:
        range: AdoptionTier
        required: true
      applicability_inventory:
        description: Section 6 Assessed. A class applicability inventory naming applicable, partial, and not-applicable mechanisms with a present, assumed, or absent detection state.
        range: boolean
        required: true
      classification_process_documented:
        description: Section 6 Operational. A documented classification process per applicable mechanism.
        range: boolean
      detection_architecture_present:
        description: Section 6 Instrumented. A real-time detection architecture instrumenting the surfaces, disclosed to participants.
        range: boolean
      cynefin_documented:
        description: Section 6 Instrumented. A documented Cynefin domain classification per mechanism with the matching action mode.
        range: boolean
      audience_baseline_declared:
        description: Section 6 Instrumented. The audience linguistic, epistemic, and ontological baseline, required when Descriptive Capacity asymmetry is applicable in a document-production context.
        range: boolean

  ConformanceDeclaration:
    description: >-
      The per-obligation conformance answers on the face. There is deliberately no overall or
      total field: conformance is per-obligation, mirroring the suite's refusal to collapse a
      profile into a single number.
    attributes:
      applicability_mapped:
        range: ConformanceAnswer
        required: true
      classification_process_documented:
        range: ConformanceAnswer
        required: true
      detection_instrumented:
        range: ConformanceAnswer
        required: true

enums:

  MechanismStatus:
    description: Section 5. The specification status of a mechanism.
    permissible_values:
      primary:
      extension_specified:
      extension_stub_scoped_out:

  CynefinDomain:
    description: Section 4.1. The Cynefin domains and their detection action modes.
    permissible_values:
      clear:
      complicated:
      complex:
      chaotic:

  AdoptionTier:
    description: Section 6. The adoption tiers.
    permissible_values:
      assessed:
      operational:
      instrumented:
      loop_closed:
      auditable:

  ConformanceAnswer:
    description: Per-obligation answer; silence is not one of the values.
    permissible_values:
      satisfied:
      declared_absent_with_justification:
      not_applicable:
