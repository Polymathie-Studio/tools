# An ROS-conformant regenerative-obligation record at the Return-Architecture tier.
# The validity conditions and disqualifiers are structured objects, not labels.
# Validates against dist/ros.schema.json.
stance:
  stance: more_regenerative_than_extractive
  scope: "Coordination labor and maintenance load across all contributor roles in the protocol domain."
  challengers:
    - "Registered harm-bearing contributors"
  review_cycle_months: 12
extraction_visible: true
validity_conditions:
  - id: non_fungibility
    name: Non-fungibility
    test: "Can the return be delivered to a different party, form, or domain without reducing its value to the extractor's accounting? If yes, it is fungible and fails."
    register: "The register of the harm (coordination-labor recognition, not cash)"
  - id: proximity
    name: Proximity
    test: "Does the return flow through a traceable causal chain from the extraction event to the parties who bore its harm, verified against the registry?"
    register: "The relational chain from extraction to harm-bearing party"
  - id: embeddedness
    name: Embeddedness
    test: "Is the return's form determined through consultation with registered harm-bearing parties, within the relationship the extraction generated, rather than at the extractor's discretion?"
    register: "The relational structure generated by the extraction obligation"
disqualifiers:
  - id: additionality
    name: The additionality trap
    mechanism: "Additionality logic routes payment to parties who would have caused harm relative to a baseline, not to parties who bore harm."
    why_categorical: "Additionality is the wrong accounting architecture; better measurement does not fix it."
  - id: geographical
    name: The geographical equivalence trap
    mechanism: "Return routed to a different location than the harm-bearing community substitutes a false accounting equivalence for a proximity relationship."
    why_categorical: "The equivalence that permits the substitution is structural, not a measurement error."
  - id: temporal_deferral
    name: The temporal deferral trap
    mechanism: "The obligation is discharged by declaring future intent to return without verifiable movement inside each review cycle."
    why_categorical: "It is a proximity failure of design; the accounting resolves through declaration rather than delivery."
  - id: sroi
    name: The SROI aggregation trap
    mechanism: "SROI aggregation permits harm to one party to be offset by benefit to another when the aggregate ratio works out."
    why_categorical: "The aggregation architecture, not proxy imprecision, is the failure; better measurement does not fix it."
returns:
  - description: "Non-tradable coordination-recognition credits issued to the contributors who absorbed the maintenance load, administered by a body they hold majority standing in, priced at the cost of the work."
    conditions_satisfied:
      - non_fungibility
      - proximity
      - embeddedness
    clear_of_disqualifiers: true
    delivered_to_registered_party: true
harm_bearing_affiliations:
  - domain_of_action: "Protocol maintenance and review coordination"
    extraction_class: "Uncompensated Hidden Factory maintenance load"
    satisfying_return_form: "Structural recognition and coordination standing, consulted with the contributors"
    access_rights:
      - "Challenge the stance declaration"
      - "Verify that proximate return was provided"
adopted_tier: return_architecture
conformance:
  extraction_visible: satisfied
  three_conditions_met: satisfied
  stance_declared: satisfied
  no_retroactive_reclassification: satisfied
