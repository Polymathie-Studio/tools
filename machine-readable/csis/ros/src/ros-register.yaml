# ROS register distillation
# One row per normative entry of the Regenerative Obligation Standard
# (standards-3_0-regenerative-obligation, v0.1.8). ROS individuates by structural mechanism, so
# two sets are rendered structurally, not as label lists: the three-part validity condition
# (non-fungibility, proximity, embeddedness, each a distinct structural condition with a test)
# and the four categorical disqualifiers (additionality, geographical equivalence, temporal
# deferral, SROI aggregation, each a distinct wrong-architecture mechanism that the standard
# states is categorical because structural, not a failure of degree that better measurement
# fixes). Rendering either as a flat taxonomy would collapse the mechanism structure into
# labels, a precision deficit under PFDS; the model encodes them as typed objects.
#
# ROS uses three named tiers (Extraction-Visibility, Return-Architecture, Full-Conformance), not
# the five-tier Assessed-through-Auditable pattern; the tier field uses Visibility, Return, Full.
# Whether a return satisfies a condition or an instrument trips a disqualifier is judgment;
# adequacy is determined relationally by registered harm-bearing parties (Ostrom DP3), not by a
# universal threshold.
standard: ROS
standard_version: 0.1.8
source: standards-3_0-regenerative-obligation-0_1_8.md
entries:

  # The three-part validity condition (Section 3), conjunctive, rendered structurally
  - id: ROS-COND-NONFUNGIBILITY
    section: "3.1"
    obligation: validity-condition
    kind: DECLARATION
    portability: universal
    checkable: shape            # a defined structural condition with a test; whether a given return meets it is judgment
    tier: All
    assertion: "Non-fungibility: the return operates in the register of the harm, not a substitute register chosen by the extracting party. Test: can the return be delivered to a different party, form, or domain without reducing its value to the extractor's accounting? If yes, it is fungible and fails. Grounded in Tuck and Yang: valid return exists within the relational context the extraction created, not at market-value equivalence."
  - id: ROS-COND-PROXIMITY
    section: "3.2"
    obligation: validity-condition
    kind: DECLARATION
    portability: universal
    checkable: shape
    tier: All
    assertion: "Proximity: the return flows through a traceable causal chain from the extraction event to the parties who bear its harm, verified against the harm-bearing affiliation registry. Proximity is relational, not geographical; return to the general treasury, or to parties who threatened rather than bore harm, is not proximate."
  - id: ROS-COND-EMBEDDEDNESS
    section: "3.3"
    obligation: validity-condition
    kind: DECLARATION
    portability: universal
    checkable: shape
    tier: All
    assertion: "Embeddedness: the return operates within the relational structure generated by the extraction, not severed by market substitution or disconnected pooling; its form is determined through consultation with registered harm-bearing parties, not at the extracting party's discretion. The settler-moves-to-innocence gestures (symbolic adoption, metaphorizing responsibility into a general-health frame, redistribution across the organization, procedural offers) resolve the extractor's accounting while leaving the harm-bearing relationship unchanged and do not satisfy this condition."

  # The four categorical disqualifiers (Section 3.2), each a wrong-architecture mechanism
  - id: ROS-DISQ-ADDITIONALITY
    section: "3.2"
    obligation: disqualifier
    kind: MUST_NOT
    portability: universal
    checkable: shape            # a return instrument built on additionality logic is identifiable from its architecture
    tier: Return
    assertion: "The additionality trap: any credit or accounting instrument built on additionality logic (a credit representing avoided harm relative to a baseline) does not satisfy proximity, because it routes payment to parties who would have caused harm rather than parties who bore it. Categorical: additionality is the wrong accounting architecture, not an imprecisely implemented right one, and better measurement does not fix it."
  - id: ROS-DISQ-GEOGRAPHICAL
    section: "3.2"
    obligation: disqualifier
    kind: MUST_NOT
    portability: universal
    checkable: shape
    tier: Return
    assertion: "The geographical equivalence trap: return routed to a community in a different location from the harm-bearing community does not satisfy proximity even when the return community faces similar conditions; the equivalence that permits the substitution is a false accounting equivalence, not a proximity relationship."
  - id: ROS-DISQ-TEMPORAL-DEFERRAL
    section: "3.2"
    obligation: disqualifier
    kind: MUST_NOT
    portability: universal
    checkable: mixed            # the declaration-without-delivery pattern is detectable across review cycles; the intent-versus-movement read has a judgment edge
    tier: Return
    assertion: "The temporal deferral trap: a return architecture that discharges a current extraction obligation by promising future return without verifiable movement does not satisfy proximity; it operates inside review cycles by declaring intent rather than demonstrating movement. Distinguishing test: can registered harm-bearing parties verify proximate return was received this period, or only that intent was declared? It is a proximity failure of design, not of degree."
  - id: ROS-DISQ-SROI
    section: "3.2"
    obligation: disqualifier
    kind: MUST_NOT
    portability: universal
    checkable: shape
    tier: Return
    assertion: "The SROI aggregation trap: any instrument based on Social Return on Investment logic does not satisfy proximity, because its aggregation architecture permits harm to one party to be offset by benefit to another when the aggregate ratio works out. The failure is the aggregation architecture, not the imprecision of financial proxies; better measurement of the ratio does not fix it."

  # Invariants (Section 2.2)
  - id: ROS-INV-VISIBLE
    section: "2.2"
    obligation: invariant
    kind: MUST
    portability: universal
    checkable: shape            # extraction is nameable, attributable, and recorded; invisibility presumes the standard unmet
    tier: Visibility
    assertion: "Extraction is visible in the record: nameable, attributable, and recorded in a form that lets participants verify what was taken from whom. When extraction is invisible to the record, the return requirement cannot be verified and the standard is presumed unmet."
  - id: ROS-INV-CONJUNCTIVE
    section: "2.2"
    obligation: invariant
    kind: MUST
    portability: universal
    checkable: mixed            # the three conditions are each partly shape; that all three hold together is the conjunctive check
    tier: Return
    assertion: "Regenerative return satisfies all three conditions simultaneously; the validity condition is conjunctive, so a return that is proximate but fungible, or non-fungible but disconnected from harm-bearing parties, does not satisfy the standard."
  - id: ROS-INV-STANCE
    section: "2.2"
    obligation: invariant
    kind: MUST
    portability: universal
    checkable: shape            # a stance declaration is present in a verifiable public record
    tier: All
    assertion: "A stance is declared in a verifiable, publicly accessible record: either non-extractive within the coordination domain, or more regenerative than extractive within it. The absence of a stance declaration is not neutral; it is a structural signal that the extraction vector has not been made visible."
  - id: ROS-INV-NORETRO
    section: "2.2"
    obligation: invariant
    kind: MUST_NOT
    portability: universal
    checkable: shape            # the record carries the obligation; an event is not reclassified to change its accounting
    tier: Visibility
    assertion: "No retroactive reclassification: once an extraction event is recorded, it is not reclassified as a contribution or gift to change its accounting status; the record carries the obligation until the return is provided or the harm-bearing party releases it through the coordinated process."

  # Stance declaration (Section 4)
  - id: ROS-STANCE-A
    section: "4"
    obligation: stance
    kind: DECLARATION
    portability: universal
    checkable: shape
    tier: Full
    assertion: "Stance A (non-extractive within the coordination domain): asserts the operational design does not draw on contributor capacity in ways that fail the three-part validity condition; carries the highest verification burden, requiring a verifiable extraction audit conducted by parties other than the declarant."
  - id: ROS-STANCE-B
    section: "4"
    obligation: stance
    kind: DECLARATION
    portability: universal
    checkable: mixed            # the ratio assessment is a process; its adequacy is judgment
    tier: Return
    assertion: "Stance B (more regenerative than extractive within the coordination domain): acknowledges extraction occurs and asserts aggregate regenerative return exceeds aggregate extraction from harm-bearing parties; for organizations in transition toward Stance A; requires the registry and a verifiable regeneration-to-extraction assessment with registered harm-bearing parties holding substantive standing."
  - id: ROS-STANCE-REQ
    section: "4"
    obligation: stance
    kind: MUST
    portability: universal
    checkable: shape            # the four minimum contents of the declaration are present or absent
    tier: All
    assertion: "The stance declaration is recorded in a public, versioned, accessible location; specifies its scope (domains, roles, contribution types); names the parties with standing to challenge it (defaulting to registered harm-bearing parties); and specifies a review cycle with a default maximum of twelve months."

  # Harm-bearing affiliation registration (Section 5)
  - id: ROS-REGISTRY-1
    section: "5"
    obligation: registry
    kind: MUST
    portability: universal
    checkable: shape            # affiliations are affirmatively registered with the four required contents, not inferred
    tier: Return
    assertion: "A harm-bearing affiliation is affirmatively registered, not inferred from behavior or asserted by the extracting party, establishing the domain of action, the class of extraction the standing applies to, the form of return that would satisfy the obligation (consulted, not determined by the extractor), and the access rights the standing confers (at minimum, to challenge the stance and to verify that proximate return was provided)."
  - id: ROS-ADEQUACY-1
    section: "5"
    obligation: registry
    kind: MUST
    portability: universal
    checkable: judgment         # adequacy is a relational determination by harm-bearing parties, not a threshold check
    tier: Return
    cross_standard_ref: "Ostrom Design Principle 3: those affected by the operational rules participate in modifying them; adequacy is assigned to registered harm-bearing parties"
    assertion: "Adequacy is not a universal quantitative threshold; it is determined relationally by the registered harm-bearing parties, and the standards-level requirement is that a coordinated process exists in which they hold substantive standing. The proximity and non-fungibility conditions provide the verifiable structural checks; adequacy beyond them is the harm-bearing parties' determination."
  - id: ROS-VERIFY-GAP
    section: "5"
    obligation: registry
    kind: DECLARATION
    portability: universal
    checkable: judgment         # substrate verification is an open design question; current assessment relies on attestation
    tier: Return
    assertion: "Whether routed return actually reaches registered harm-bearing parties rather than being captured at intermediate coordination layers is not yet substrate-verifiable; current conformance relies on harm-bearing party attestation, and substrate-level verification is an open Witness Layer design question."

  # Visibility condition (Section 6)
  - id: ROS-VIS-1
    section: "6"
    obligation: visibility
    kind: MUST
    portability: universal
    checkable: mixed            # named channels and proactive disclosure are shape; maintaining registerability under identity fusion is judgment
    tier: Visibility
    cross_standard_ref: "ASEP (protection for claim-raisers) and the Four Batteries Capacity Standard (Stage D-E identity fusion as a visibility suppressor)"
    assertion: "The system maintains the conditions under which extraction is registerable by participants, not only recorded: named accessible channels to report suspected extraction without requiring certainty, periodic proactive disclosure of what was drawn from which contributor classes, protection for those who register claims, and active attention to identity fusion as a visibility suppressor (claim-raising must not require the contributor to first name themselves as harmed by work they have incorporated into their identity)."

  # Positive reference instrument (Section 7, Tier 2)
  - id: ROS-INSTRUMENT-REF
    section: "7"
    obligation: reference
    kind: DECLARATION
    portability: universal
    checkable: shape            # the four features are present or a named equivalent is given
    tier: Return
    assertion: "A conformant return-instrument reference (the Regen Network biocultural credit model): non-tradability (no secondary resale, which would sever the relationship), community coordination majority (the harm-bearing community holds majority, not advisory, standing over administration), cost-based pricing (value grounded in the actual regenerative work, not market price), and Free-Prior-and-Informed-Consent before issuance. A designer accounts for each feature or names the equivalent structural condition it serves."

  # Adoption tiers (Section 7)
  - id: ROS-TIER-1
    section: "7"
    obligation: tier-gate
    kind: DECLARATION
    portability: universal
    checkable: shape
    tier: Visibility
    assertion: "Tier 1 Extraction Visibility: a maintained, publicly accessible record of extraction events; contributors can verify what was drawn and by whom; the stance declaration specifies the domain and the parties with standing to challenge the records. Does not require the three-part validity condition, only that extraction be visible."
  - id: ROS-TIER-2
    section: "7"
    obligation: tier-gate
    kind: DECLARATION
    portability: universal
    checkable: mixed            # composite
    tier: Return
    assertion: "Tier 2 Return Architecture: a return architecture satisfying the three-part validity condition for extraction above a specified threshold, the harm-bearing affiliation registry in place, and the additionality trap and settler-moves gestures operative as exclusions in the record."
  - id: ROS-TIER-3
    section: "7"
    obligation: tier-gate
    kind: DECLARATION
    portability: universal
    checkable: mixed            # composite
    tier: Full
    assertion: "Tier 3 Full Conformance: the stance declaration independently assessed by parties with no financial or coordination interest, registered harm-bearing parties holding substantive standing in the assessment, the return architecture applied to all extraction within scope with no exclusion threshold, and Stance A or B actively maintained on a review cycle of twelve months or fewer. This is the structural floor the highest suite level requires."
