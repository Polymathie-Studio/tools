# NON-conformant: the temporal phases omit the liminal phase. By Section 3.5 and 2.3 a process that
# jumps from disruption to resolution with no liminal phase is applying a pre-existing frame (the
# applying-without-understanding failure mode), not sensemaking, so the liminal phase is a required
# part of the record. Must fail.
disruption:
  description: "A metric moved unexpectedly."
  specifiable: true
relating:
  cues:
    - "The metric crossed a threshold."
  frame: "The known playbook for that threshold."
entanglement:
  actions_changed_understanding: true
  understanding_changed_actions: true
sufficiency:
  frame_provisional: true
  revision_conditions: "None named."
  stopped_before_complete: true
  next_action_tests_frame: true
temporal_phases:
  disruption_phase: "The metric moved."
  # liminal_phase deliberately omitted: the process went straight to the pre-existing frame
  liminal_phase_documented: false
  resolution_phase: "Applied the existing playbook unchanged."
  resolution_distinct_from_prior: false
architecture:
  adopted_tier: operational
  structural_assumptions_acknowledged: true
conformance:
  disruption_occasioned_satisfied: satisfied
  particular_to_general_satisfied: satisfied
  action_entangled_satisfied: satisfied
  sufficiency_oriented_satisfied: satisfied
  temporally_structured_satisfied: declared_absent_with_justification
