id: https://standards.example/pfds
name: pfds
title: PFDS precision review
description: >-
  The one canonical source for the machine-readable layer of the Precision-First Design Standard
  (standards-3_0-precision-first, v2.5.1), the suite meta-standard. PFDS specifies what precision
  requires across every standard, so the twelve corollaries and the five precision-failure patterns
  are rendered as typed objects, each carrying its structure (a corollary its condition and its
  two failure directions and corrective, a pattern its structural signature and response), not as
  flat label enums. Rendering either as a taxonomy would collapse the structure into labels, the
  precision deficit PFDS itself names. A corollary reduced to a name is not a corollary, so its
  condition and both directions are required.

  The tree root is a PrecisionReview: an artifact reviewed against the precision-first invariant,
  the twelve corollaries, Method-Structure Congruence, and the failure taxonomy, producing a deficit
  map keyed to the patterns, with the review's adoption depth, obligation-loop tier, and
  per-invariant conformance. Every artifact in dist/ is generated from this file.

  The invariant, congruence, and the corollary conditions are meta-conditions whose per-element
  verdict runs through the independent-observer test; whether a given element satisfies a corollary
  is the reviewer's determination, and tier-gating stays in the checker.
license: CC-BY-4.0
prefixes:
  linkml: https://w3id.org/linkml/
  pfds: https://standards.example/pfds/
default_prefix: pfds
default_range: string
imports:
  - linkml:types

classes:

  PrecisionReview:
    tree_root: true
    description: A review of a governed artifact against the invariant, the twelve corollaries, congruence, and the failure taxonomy, producing a deficit map.
    attributes:
      subject:
        description: The governed artifact under review.
        required: true
      adoption_depth:
        description: Section 6.1. The depth of the review (auditing, remediation, design-time).
        range: AdoptionDepth
        required: true
      obligation_tier:
        range: ObligationTier
        required: true
      corollaries:
        description: >-
          Section 2. The twelve corollaries, each a structured precision condition with its two failure
          directions. They are constitutive of a precision review, not optional reference: a review
          that carries no corollaries could claim conformance while never assessing against the
          precision conditions, so the review carries the full precision structure it assessed against.
        range: Corollary
        multivalued: true
        inlined_as_list: true
        required: true
      failure_patterns:
        description: Section 7. The precision-failure patterns the review keys deficits to, each a structured signature-and-response; constitutive of the review, not optional.
        range: FailurePattern
        multivalued: true
        inlined_as_list: true
        required: true
      deficits:
        description: Section 6.1. The precision deficit map, each deficit located and keyed to a failure pattern.
        range: PrecisionDeficit
        multivalued: true
        inlined_as_list: true
      congruence_checked:
        description: Section 3. Method-Structure Congruence was assessed for the artifact's production.
        range: boolean
        required: true
      conformance:
        description: The invariant answers on the face; no total.
        range: ConformanceDeclaration
        required: true

  Corollary:
    description: >-
      Section 2. One precision corollary, individuated by its condition and its two failure
      directions (a deficit and an imposition), not by a label. A corollary with no directions is
      not a corollary, so condition, deficit_direction, and imposition_direction are required.
    attributes:
      id:
        description: The corollary handle (for example operational_definition, taxonomy_completeness).
        required: true
      name:
        required: true
      condition:
        description: The iff condition the corollary specifies.
        required: true
      deficit_direction:
        description: What under-specification fails to prevent.
        required: true
      imposition_direction:
        description: What over-specification produces.
        required: true
      corrective:
        description: The corrective exemplar the standard cites.

  FailurePattern:
    description: >-
      Section 7. One precision-failure pattern, individuated by its structural signature and its
      response. A pattern with no signature is a label, so signature and response are required.
    attributes:
      id:
        description: The pattern handle (for example normative_substitution, category_collapse).
        required: true
      name:
        required: true
      structural_signature:
        description: The observable signature that identifies the pattern.
        required: true
      response:
        description: The response the pattern enables.
        required: true

  PrecisionDeficit:
    description: Section 6.1. One entry in the precision deficit map.
    attributes:
      location:
        description: The document and location of the deficit.
        required: true
      pattern:
        description: >-
          The failure-pattern handle the deficit is keyed to. The set is open: a deficit that fits
          no current pattern is recorded as "unclassified" and evaluated against the extension
          criteria, not forced into an ill-fitting pattern (the Corollary-2 overflow, realized
          structurally here rather than asserted).
        required: true
      decision:
        description: Section 6.5. The documented decision (remediation, acceptance with rationale, deferral, or not-a-deficit); required at Loop-Closed.

  ConformanceDeclaration:
    description: >-
      The invariant answers on the face. There is deliberately no overall or total field:
      conformance is per-condition, mirroring the suite's refusal to collapse a profile into a
      single number.
    attributes:
      violations_detectable:
        range: ConformanceAnswer
        required: true
      compliance_serves_purpose:
        range: ConformanceAnswer
        required: true
      method_structure_congruent:
        range: ConformanceAnswer
        required: true
      deficits_mapped:
        range: ConformanceAnswer
        required: true

enums:

  AdoptionDepth:
    description: Section 6.1. The three adoption depths.
    permissible_values:
      auditing:
      remediation:
      design_time:

  ObligationTier:
    description: Section 6.5. The five obligation-loop tiers.
    permissible_values:
      assessed:
      operational:
      instrumented:
      loop_closed:
      auditable:

  ConformanceAnswer:
    description: Per-condition answer; silence is not one of the values.
    permissible_values:
      satisfied:
      declared_absent_with_justification:
      not_applicable:
